# main에 push되면 weonit.kr(GitHub Pages)에 배포
# - vite build: 루트 안내 페이지 + 화면들 (vite.config.ts의 input)
# - storybook build: /storybook/
# 저장소 Settings > Pages > Source가 "GitHub Actions"여야 동작해요
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run build-storybook -- --output-dir dist/storybook

      # vite는 public/ 폴더만 복사해서, 루트에 있는 파비콘·도메인 파일은 직접 넣어요
      - run: cp CNAME favicon.ico favicon.svg apple-touch-icon.png dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
